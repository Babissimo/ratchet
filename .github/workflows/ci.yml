# Builds Ratchet on every push to main, so a broken build on the trunk is
# caught immediately. Uses a real Mac runner (macos-latest) because the
# build links AppKit and Sources/FreeAgentKit/Secrets.swift is gitignored
# per CLAUDE.md — a fresh checkout won't compile without it. Requires the
# same repository secrets as release.yml (Settings -> Secrets and
# variables -> Actions):
#
#   FREEAGENT_CLIENT_ID
#   FREEAGENT_CLIENT_SECRET
#
# `swift test` is not run here: CLAUDE.md notes it doesn't work in this
# repo's normal dev environment because XCTest needs a full Xcode install,
# not just the Command Line Tools. macos-latest runners do ship Xcode, but
# this workflow sticks to `swift build` to match the only verification
# step actually exercised locally.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sources/FreeAgentKit/Secrets.swift is gitignored (see
      # Secrets.swift.example) and required to compile FreeAgentKit. A
      # fresh clone or worktree doesn't build without it, and neither does
      # this checkout.
      - name: Write Secrets.swift from repository secrets
        env:
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
        run: |
          cat > Sources/FreeAgentKit/Secrets.swift << EOF
          // Generated by .github/workflows/ci.yml — not committed.
          enum FreeAgentSecrets {
              static let clientID = "${FREEAGENT_CLIENT_ID}"
              static let clientSecret = "${FREEAGENT_CLIENT_SECRET}"
              static let environment: FreeAgentEnvironment = .sandbox
          }
          EOF

      - name: Build
        run: swift build
