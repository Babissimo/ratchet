# Builds and tests Ratchet on every push to main and every PR against it. Uses a real Mac runner
# because the build links AppKit, and because the runner's Xcode supplies the XCTest that the
# Command Line Tools lack, which makes this the only place the XCTest suites run (see CLAUDE.md,
# "Building and testing"). Test and Antagonise both write throwaway Keychain items, which the
# runner's login keychain accepts without a prompt.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # Pinned to release.yml's image, so CI builds with a release's toolchain and SDK, on the macOS
    # the app is developed on, and an image change can't alter results under an unchanged tree.
    runs-on: macos-15
    env:
      # Unbuffered, a step killed by its timeout still logs the test it was stuck in.
      NSUnbufferedIO: "YES"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      # A hang here is most likely an unanswered modal alert; see `presentAlert` in
      # StatusItemController.
      - name: Test
        run: swift test
        timeout-minutes: 5

      - name: Antagonise
        run: swift run Antagonise
        timeout-minutes: 5
