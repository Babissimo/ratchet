# Builds Ratchet.app on a tag push and attaches it, zipped, to a GitHub
# Release. Unsigned and unnotarized — see TODO.md ("Distribution without
# notarization") for why: no paid Apple Developer Program membership.
# Users will need to right-click -> Open on first launch (documented in
# README.md).
#
# Requires a real Mac runner (macos-latest) because the build links AppKit.
# The app carries no FreeAgent credentials (the sign-in service in worker/
# holds them), so the build needs no repository secrets.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (release)
        run: swift build -c release

      - name: Assemble Ratchet.app
        run: scripts/build-app.sh release

      # ditto preserves resource forks and extended attributes, which zip
      # doesn't — the standard way to zip a macOS .app bundle intact.
      - name: Zip Ratchet.app
        run: ditto -c -k --sequesterRsrc --keepParent .build/Ratchet.app Ratchet.app.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Ratchet.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
