# Builds Ratchet.app on a tag push (v1.2.0 → version 1.2.0) and attaches it, zipped, to a GitHub
# Release. scripts/release.sh pushes the tag and then points the Homebrew tap at the result.
#
# Not notarized (see TODO.md, "Distribution without notarization"), and signed ad hoc because
# the runner has no "Ratchet" certificate. The app carries no FreeAgent credentials (the sign-in
# service in worker/ holds them), so the build needs no repository secrets.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # AppKit only links on macOS. Pinned so a runner image change can't swap the toolchain
    # under a release.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Ratchet.app
        run: RATCHET_VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh release

      # ditto keeps the bundle's extended attributes and symlinks intact, which zip doesn't.
      - name: Zip Ratchet.app
        run: ditto -c -k --sequesterRsrc --keepParent .build/Ratchet.app Ratchet.app.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run finds the release an earlier attempt created, so it replaces the asset instead.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Ratchet.app.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" Ratchet.app.zip \
              --verify-tag --generate-notes --title "Ratchet ${GITHUB_REF_NAME#v}"
          fi
          echo "Ratchet.app.zip sha256: \`$(shasum -a 256 Ratchet.app.zip | cut -d' ' -f1)\`" \
            >> "$GITHUB_STEP_SUMMARY"
