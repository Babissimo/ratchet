# Builds Ratchet.app on a tag push and attaches it, zipped, to a GitHub
# Release. Unsigned and unnotarized — see TODO.md ("Distribution without
# notarization") for why: no paid Apple Developer Program membership.
# Users will need to right-click -> Open on first launch (documented in
# README.md).
#
# Requires a real Mac runner (macos-latest) because the build links AppKit
# and Sources/FreeAgentKit/Secrets.swift is gitignored per CLAUDE.md — a
# fresh checkout, including this runner, won't compile without it. Before
# this workflow can run successfully, add these repository secrets
# (Settings -> Secrets and variables -> Actions) with the same client
# ID/secret already in use locally (from the FreeAgent Developer Dashboard,
# https://dev.freeagent.com/) — live-tested confirming this one OAuth app
# isn't sandbox-gated, so no separate production registration is needed.
# Release builds are what real users get, so they're always built against
# FreeAgentEnvironment.production regardless:
#
#   FREEAGENT_CLIENT_ID
#   FREEAGENT_CLIENT_SECRET
#
# These do not exist yet — this workflow won't build until they're added.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sources/FreeAgentKit/Secrets.swift is gitignored (see
      # Secrets.swift.example) and required to compile FreeAgentKit. A
      # fresh clone or worktree doesn't build without it, and neither does
      # this checkout.
      - name: Write Secrets.swift from repository secrets
        env:
          FREEAGENT_CLIENT_ID: ${{ secrets.FREEAGENT_CLIENT_ID }}
          FREEAGENT_CLIENT_SECRET: ${{ secrets.FREEAGENT_CLIENT_SECRET }}
        run: |
          cat > Sources/FreeAgentKit/Secrets.swift << EOF
          // Generated by .github/workflows/release.yml — not committed.
          enum FreeAgentSecrets {
              static let clientID = "${FREEAGENT_CLIENT_ID}"
              static let clientSecret = "${FREEAGENT_CLIENT_SECRET}"
              static let environment: FreeAgentEnvironment = .production
          }
          EOF

      - name: Build (release)
        run: swift build -c release

      - name: Assemble Ratchet.app
        run: scripts/build-app.sh release

      # ditto preserves resource forks and extended attributes, which zip
      # doesn't — the standard way to zip a macOS .app bundle intact.
      - name: Zip Ratchet.app
        run: ditto -c -k --sequesterRsrc --keepParent .build/Ratchet.app Ratchet.app.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Ratchet.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
